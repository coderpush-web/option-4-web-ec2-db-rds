AWSTemplateFormatVersion: '2010-09-09'
Description: 'Application Compute Module: Option 4 - EC2 Web + AWS Managed RDS MySQL'

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

  EC2InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 Instance Type (t3.micro for dev, t3.small/t4g.small for prod)

  RDSInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS Instance Class (db.t3.micro for dev, db.t4g.small for prod)

  WebVolumeSize:
    Type: Number
    Default: 20

  RDSAllocatedStorage:
    Type: Number
    Default: 20

  DBUser:
    Type: String
    Default: appadmin

  DBPassword:
    Type: String
    NoEcho: true
    Default: P@ssw0rdSecure2026!

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets across 2 AZs for RDS
      SubnetIds:
        - Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnet1Id'
        - Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnet2Id'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-rds-subnet-group'
        - Key: Environment
          Value: !Ref EnvironmentName

  RDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${EnvironmentName}-rds-mysql'
      Engine: mysql
      EngineVersion: '8.4.3'
      DBInstanceClass: !Ref RDSInstanceClass
      AllocatedStorage: !Ref RDSAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      CopyTagsToSnapshot: true
      DBName: appdb
      MasterUsername: !Ref DBUser
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub '${EnvironmentName}-DatabaseSecurityGroupId'
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      MultiAZ: false
      DeleteAutomatedBackups: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-rds-instance'
        - Key: Environment
          Value: !Ref EnvironmentName

  WebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref EC2InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile:
        Fn::ImportValue: !Sub '${EnvironmentName}-EC2InstanceProfileName'
      SubnetId:
        Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnetId'
      SecurityGroupIds:
        - Fn::ImportValue: !Sub '${EnvironmentName}-WebSecurityGroupId'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref WebVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            dnf update -y
            dnf install -y nodejs npm

            mkdir -p /opt/app
            cat << 'EOF' > /opt/app/package.json
            {
              "name": "sample-web-app",
              "version": "1.0.0",
              "main": "server.js",
              "dependencies": {
                "express": "^4.19.2",
                "mysql2": "^3.9.7"
              }
            }
            EOF

            cat << 'EOF' > /opt/app/server.js
            const express = require('express');
            const mysql = require('mysql2/promise');
            const app = express();
            const port = 80;

            const pool = mysql.createPool({
              host: process.env.DB_HOST,
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME,
              waitForConnections: true,
              connectionLimit: 5,
              connectTimeout: 5000
            });

            app.get('/health', (req, res) => res.json({ status: 'ok', env: '${EnvTag}' }));
            app.get('/', async (req, res) => {
              let dbStatus = 'Checking RDS connection...';
              try {
                const [rows] = await pool.query('SELECT 1 + 1 AS solution, NOW() as current_time');
                dbStatus = `Connected to RDS successfully (Result: ` + rows[0].solution + `, Time: ` + rows[0].current_time + `)`;
              } catch (err) {
                dbStatus = 'Connection error: ' + err.message;
              }
              res.send(`
                <!DOCTYPE html><html><body style="font-family:sans-serif;background:#f4f6f8;padding:40px;">
                <div style="background:white;padding:24px;border-radius:8px;max-width:650px;margin:0 auto;box-shadow:0 4px 6px rgba(0,0,0,0.1)">
                  <h1 style="color:#ff9900;">🚀 Option 4: EC2 Web + Managed RDS (${EnvTag})</h1>
                  <p style="background:#e7f4e8;color:#1e7e34;padding:12px;border-radius:4px;">
                    <strong>RDS Status:</strong> ` + dbStatus + `
                  </p>
                  <table style="width:100%;border-collapse:collapse;">
                    <tr><th style="text-align:left;padding:6px;border-bottom:1px solid #ddd;">RDS Endpoint</th><td style="padding:6px;border-bottom:1px solid #ddd;">${RDSHost}</td></tr>
                    <tr><th style="text-align:left;padding:6px;border-bottom:1px solid #ddd;">Database Name</th><td style="padding:6px;border-bottom:1px solid #ddd;">appdb</td></tr>
                    <tr><th style="text-align:left;padding:6px;">Environment</th><td style="padding:6px;">${EnvTag}</td></tr>
                  </table>
                </div></body></html>
              `);
            });
            app.listen(port, () => console.log('Listening on port ' + port));
            EOF

            cd /opt/app
            npm install

            cat << EOF > /etc/systemd/system/webapp.service
            [Unit]
            Description=Web App Service
            After=network.target

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/app
            Environment=DB_HOST=${RDSHost}
            Environment=DB_USER=${User}
            Environment=DB_PASSWORD=${Password}
            Environment=DB_NAME=appdb
            ExecStart=/usr/bin/node /opt/app/server.js
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload
            systemctl enable webapp
            systemctl start webapp
          - EnvTag: !Ref EnvironmentName
            RDSHost: !GetAtt RDSInstance.Endpoint.Address
            User: !Ref DBUser
            Password: !Ref DBPassword
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-web-server'
        - Key: Environment
          Value: !Ref EnvironmentName

  WebServerEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref WebServerInstance
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-web-eip'
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  WebsiteURL:
    Description: Website URL
    Value: !Sub 'http://${WebServerEIP.PublicIp}'
  RDSEndpoint:
    Description: Managed RDS Endpoint Address
    Value: !GetAtt RDSInstance.Endpoint.Address
