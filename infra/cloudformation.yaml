AWSTemplateFormatVersion: '2010-09-09'
Description: 'Application Compute Module: Option 4 - EC2 Web (Docker from ECR) + AWS Managed RDS MySQL'

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

  EC2InstanceType:
    Type: String
    Default: t3.micro

  RDSInstanceClass:
    Type: String
    Default: db.t3.micro

  WebVolumeSize:
    Type: Number
    Default: 20

  RDSAllocatedStorage:
    Type: Number
    Default: 20

  DBUser:
    Type: String
    Default: appadmin

  DBPassword:
    Type: String
    NoEcho: true
    Default: P@ssw0rdSecure2026!

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  ImageTag:
    Type: String
    Default: latest

  DomainName:
    Type: String
    Default: png261.dev

  SubdomainName:
    Type: String
    Default: opt4-dev.png261.dev

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets across 2 AZs for RDS
      SubnetIds:
        - Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnet1Id'
        - Fn::ImportValue: !Sub '${EnvironmentName}-PrivateSubnet2Id'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-rds-subnet-group'
        - Key: Environment
          Value: !Ref EnvironmentName

  RDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${EnvironmentName}-mysql-rds'
      AllocatedStorage: !Ref RDSAllocatedStorage
      DBInstanceClass: !Ref RDSInstanceClass
      Engine: mysql
      EngineVersion: '8.0.46'
      MasterUsername: !Ref DBUser
      MasterUserPassword: !Ref DBPassword
      DBName: appdb
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub '${EnvironmentName}-DatabaseSecurityGroupId'
      MultiAZ: false
      PubliclyAccessible: false
      StorageType: gp3
      BackupRetentionPeriod: 7
      DeleteAutomatedBackups: true
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-mysql-rds'
        - Key: Environment
          Value: !Ref EnvironmentName

  WebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref EC2InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile:
        Fn::ImportValue: !Sub '${EnvironmentName}-EC2InstanceProfileName'
      SubnetId:
        Fn::ImportValue: !Sub '${EnvironmentName}-PublicSubnetId'
      SecurityGroupIds:
        - Fn::ImportValue: !Sub '${EnvironmentName}-WebSecurityGroupId'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref WebVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -e
            dnf update -y
            dnf install -y docker aws-cli
            systemctl enable docker
            systemctl start docker
            usermod -aG docker ec2-user

            AWS_REGION="${AWS::Region}"
            ACCOUNT_ID="${AWS::AccountId}"
            IMAGE_URI="${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EnvironmentName}-option-4-web-app:${ImageTag}"

            echo "Logging into Amazon ECR..."
            aws ecr get-login-password --region "${AWS::Region}" | docker login --username AWS --password-stdin "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com" || true

            echo "Pulling Docker image: $IMAGE_URI"
            docker pull "$IMAGE_URI" || true

            cat << 'SVC' > /etc/systemd/system/react-webapp.service
            [Unit]
            Description=Dockerized React Web App connected to RDS MySQL
            After=docker.service
            Requires=docker.service

            [Service]
            TimeoutStartSec=0
            Restart=always
            ExecStartPre=-/usr/bin/docker stop react-webapp
            ExecStartPre=-/usr/bin/docker rm react-webapp
            ExecStart=/usr/bin/docker run --name react-webapp -p 80:80 \
              -e APP_ENV=${EnvironmentName} \
              -e PORT=80 \
              -e DB_HOST=${RDSEndpoint} \
              -e DB_USER=${User} \
              -e DB_PASSWORD=${Password} \
              -e DB_NAME=appdb \
              ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EnvironmentName}-option-4-web-app:${ImageTag}
            ExecStop=/usr/bin/docker stop react-webapp

            [Install]
            WantedBy=multi-user.target
            SVC

            systemctl daemon-reload
            systemctl enable react-webapp
            systemctl start react-webapp || true
          - RDSEndpoint: !GetAtt RDSInstance.Endpoint.Address
            User: !Ref DBUser
            Password: !Ref DBPassword
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-web-server'
        - Key: Environment
          Value: !Ref EnvironmentName

  WebServerEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref WebServerInstance
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-web-eip'
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  WebsiteURL:
    Description: Website URL
    Value: !Sub 'http://${WebServerEIP.PublicIp}'
  PublicIP:
    Description: Elastic IP
    Value: !Ref WebServerEIP
  RDSEndpointAddress:
    Description: RDS Endpoint Address
    Value: !GetAtt RDSInstance.Endpoint.Address
  CustomDomainURL:
    Description: Custom Domain Website URL (png261.dev)
    Value: !Sub 'https://${SubdomainName}'
  RootDomain:
    Description: Root Domain Name
    Value: !Ref DomainName
  DnsRecordType:
    Description: DNS Record Type for Cloudflare / Route 53
    Value: 'A'
  DnsRecordName:
    Description: DNS Record Name
    Value: !Ref SubdomainName
  DnsRecordValue:
    Description: DNS Record Value (IPv4 Target)
    Value: !Ref WebServerEIP
